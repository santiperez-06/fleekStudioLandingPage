<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />

  <!-- ── Primary SEO ── -->
  <title>FLEEK studio</title>
  <meta name="description" content="FLEEK studio: arquitectura y construcción en Argentina. Diseñamos proyectos residenciales, comerciales y corporativos con rigor, innovación y sensibilidad material." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="FLEEK studio" />
  <link rel="canonical" href="https://www.fleek-studio.com.ar/" />

  <!-- ── Geo ── -->
  <meta name="geo.region" content="AR" />
  <meta name="geo.placename" content="Argentina" />

  <!-- ── Open Graph ── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FLEEK studio" />
  <meta property="og:title" content="FLEEK studio — Arquitectura + Construcción | Argentina" />
  <meta property="og:description" content="Somos FLEEK studio, estudio de arquitectura y construcción en Argentina. Proyectos residenciales, comerciales, gastronómicos y corporativos." />
  <meta property="og:url" content="https://www.fleek-studio.com.ar/" />
  <meta property="og:image" content="https://www.fleek-studio.com.ar/imgs/FLEEK_Completo-01.png" />
  <meta property="og:locale" content="es_AR" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FLEEK studio — Arquitectura + Construcción | Argentina" />
  <meta name="twitter:description" content="Somos FLEEK studio, estudio de arquitectura y construcción en Argentina. Proyectos residenciales, comerciales, gastronómicos y corporativos." />
  <meta name="twitter:image" content="https://www.fleek-studio.com.ar/imgs/FLEEK_Completo-01.png" />

  <!-- ── Structured Data: Organization + ProfessionalService ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["Organization", "ProfessionalService"],
    "name": "FLEEK studio",
    "alternateName": "Fleek Architecture + Construction",
    "url": "https://www.fleek-studio.com.ar",
    "logo": "https://www.fleek-studio.com.ar/imgs/FLEEK_Completo-01.png",
    "image": "https://www.fleek-studio.com.ar/imgs/FLEEK_Completo-01.png",
    "description": "Estudio de arquitectura y construcción en Argentina. Especializados en proyectos residenciales, comerciales, gastronómicos y corporativos.",
    "founders": [
      { "@type": "Person", "name": "Manuel" },
      { "@type": "Person", "name": "Martín" }
    ],
    "areaServed": {
      "@type": "Country",
      "name": "Argentina"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+54-11-4159-3104",
      "contactType": "customer service",
      "availableLanguage": "Spanish"
    },
    "sameAs": [
      "https://www.instagram.com/fleekestudio/"
    ],
    "email": "hola@fleek-studio.com"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/project.css" />

  <link rel="icon" type="image/jpeg" href="imgs/icon.jpeg" />
</head>

<body>

  <!-- ====================================================
       NAVBAR — permanente, nunca se re-renderiza
  ==================================================== -->
  <header class="navbar" role="banner">
    <div class="navbar__inner">

      <!-- Logo imagen -->
      <div class="navbar__logo" style="position:relative;">
        <img src="imgs/FLEEK_Isologo-09.png" alt="FLEEK studio" class="navbar__logo-img" />
        <a href="/" style="position:absolute;inset:0;z-index:1;" aria-label="FLEEK studio — inicio"></a>
      </div>

      <!-- Nav links (desktop) -->
      <nav aria-label="Navegación principal">
        <ul class="navbar__links">
          <!-- <li><a href="/nosotros"  class="navbar__link">About</a> -->
          <li><a href="/#obras" class="navbar__link">Obras</a></li>
          <li><a href="/contacto"  class="navbar__link">Contacto</a></li>
          <li><a href="https://www.instagram.com/fleekestudio/"  class="navbar__link">IG</a></li>
        </ul>
      </nav>

      <!-- Burger mobile -->
      <button class="navbar__burger" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

    </div>
  </header>

  <!-- Mobile drawer -->
  <nav class="navbar__drawer" aria-label="Menú móvil">
    <!-- <a href="/nosotros"  class="navbar__link">About</a> -->
    <a href="/#obras" class="navbar__link">Obras</a>
    <a href="/contacto"  class="navbar__link">Contacto</a>
    <a href="https://www.instagram.com/fleekestudio/"  class="navbar__link">IG</a>
  </nav>

  <!-- ====================================================
       APP SHELL — el contenido se inyecta acá por app.js
  ==================================================== -->
  <div id="app"></div>

  <!-- ====================================================
       SCRIPTS — orden de carga es importante
         1. proyectos.js      → define PROYECTOS[]
         2. router.js         → define Router
         3. ui.js             → define helpers de UI
         4. hero-slideshow.js → define HeroSlideshow
         5. lightbox.js       → define Lightbox
         6. app.js            → usa todo lo anterior
  ==================================================== -->
  <script src="js/router.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/hero-slideshow.js" defer></script>
  <script src="js/lightbox.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
