<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <meta name="description" content="Estudio de arquitectura. Proyectos residenciales, comerciales e institucionales con rigor y sensibilidad material." />
  <title>FLEEK studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/project.css" />

  <link rel="icon" type="image/jpeg" href="imgs/icon.jpeg" />
</head>

<body>

  <!-- ====================================================
       NAVBAR — permanente, nunca se re-renderiza
  ==================================================== -->
  <header class="navbar" role="banner">
    <div class="navbar__inner">

      <!-- Logo imagen -->
      <div class="navbar__logo" style="position:relative;">
        <img src="imgs/FLEEK_Completo-01.png" alt="FLEEK studio" />
        <a href="/" style="position:absolute;inset:0;z-index:1;" aria-label="FLEEK studio — inicio"></a>
      </div>

      <!-- Nav links (desktop) -->
      <nav aria-label="Navegación principal">
        <ul class="navbar__links">
          <li><a href="/#proyectos" class="navbar__link">Proyectos</a></li>
          <li><a href="/#contacto"  class="navbar__link">Contacto</a></li>
        </ul>
      </nav>

      <!-- Burger mobile -->
      <button class="navbar__burger" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

    </div>
  </header>

  <!-- Mobile drawer -->
  <nav class="navbar__drawer" aria-label="Menú móvil">
    <a href="/#proyectos" class="navbar__link">Proyectos</a>
    <a href="/#contacto"  class="navbar__link">Contacto</a>
  </nav>

  <!-- ====================================================
       APP SHELL — el contenido se inyecta acá por app.js
  ==================================================== -->
  <div id="app"></div>

  <!-- ====================================================
       SCRIPTS — orden de carga es importante
         1. proyectos.js      → define PROYECTOS[]
         2. router.js         → define Router
         3. ui.js             → define helpers de UI
         4. hero-slideshow.js → define HeroSlideshow
         5. lightbox.js       → define Lightbox
         6. app.js            → usa todo lo anterior
  ==================================================== -->
  <script src="js/router.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/hero-slideshow.js" defer></script>
  <script src="js/lightbox.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
